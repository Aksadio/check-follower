name: Auto unfollow non-followers

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a run by a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = only print, false = really unfollow)"
        default: "true"

# never run two at once
concurrency:
  group: follow-sync
  cancel-in-progress: false

jobs:
  unfollow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run unfollow script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || (vars.LIVE == 'true' && 'false' || 'true') }}
          MAX_UNFOLLOWS: "30"
        run: |
          echo "Run time (UTC): $(date -u)"
          echo "Event: ${{ github.event_name }}  |  DRY_RUN=$DRY_RUN"
          python unfollow.py
